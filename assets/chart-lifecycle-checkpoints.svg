<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1000" height="460" fill="#fcfcfb"/>

  <text x="500" y="28" text-anchor="middle" font-size="20" font-weight="700" fill="#0b0b0b">Validation Checkpoints in Practice</text>
  <text x="500" y="48" text-anchor="middle" font-size="12" fill="#52514e">The same three checkpoints, implemented differently by architecture (Section 3.2.1)</text>

  <!-- column headers -->
  <text x="305" y="80" text-anchor="middle" font-size="14" font-weight="700" fill="#0b0b0b">INGRESS</text>
  <line x1="255" y1="88" x2="355" y2="88" stroke="#2a78d6" stroke-width="3" stroke-linecap="round"/>
  <text x="305" y="104" text-anchor="middle" font-size="11" fill="#898781">catches: structural,</text>
  <text x="305" y="117" text-anchor="middle" font-size="11" fill="#898781">semantic (2.1&#8211;2.2)</text>

  <text x="555" y="80" text-anchor="middle" font-size="14" font-weight="700" fill="#0b0b0b">IN-FLIGHT</text>
  <line x1="505" y1="88" x2="605" y2="88" stroke="#eb6834" stroke-width="3" stroke-linecap="round"/>
  <text x="555" y="104" text-anchor="middle" font-size="11" fill="#898781">catches: statistical &amp;</text>
  <text x="555" y="117" text-anchor="middle" font-size="11" fill="#898781">distributional (2.4)</text>

  <text x="830" y="80" text-anchor="middle" font-size="14" font-weight="700" fill="#0b0b0b">EGRESS</text>
  <line x1="780" y1="88" x2="880" y2="88" stroke="#1baf7a" stroke-width="3" stroke-linecap="round"/>
  <text x="830" y="104" text-anchor="middle" font-size="11" fill="#898781">catches: temporal (2.5),</text>
  <text x="830" y="117" text-anchor="middle" font-size="11" fill="#898781">silent corruption</text>

  <line x1="20" y1="135" x2="980" y2="135" stroke="#e1e0d9" stroke-width="1.5"/>

  <!-- Lane 1: synchronous request/response -->
  <text x="20" y="172" font-size="13" font-weight="700" fill="#0b0b0b">Synchronous</text>
  <text x="20" y="188" font-size="13" font-weight="700" fill="#0b0b0b">request/response</text>

  <rect x="175" y="152" width="235" height="62" rx="6" fill="#fcfcfb" stroke="#2a78d6" stroke-width="1.5"/>
  <text x="292" y="177" text-anchor="middle" font-size="12" fill="#0b0b0b">Validate request schema,</text>
  <text x="292" y="195" text-anchor="middle" font-size="12" fill="#0b0b0b">type, and business rules</text>

  <polygon points="415,177 415,189 428,183" fill="#898781"/>
  <rect x="435" y="152" width="200" height="62" rx="6" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="535" y="177" text-anchor="middle" font-size="12" fill="#898781">Fewer internal stages</text>
  <text x="535" y="195" text-anchor="middle" font-size="12" fill="#898781">to check in between</text>

  <polygon points="640,177 640,189 653,183" fill="#898781"/>
  <rect x="660" y="152" width="235" height="62" rx="6" fill="#fcfcfb" stroke="#1baf7a" stroke-width="1.5"/>
  <text x="777" y="177" text-anchor="middle" font-size="12" fill="#0b0b0b">Validate response schema</text>
  <text x="777" y="195" text-anchor="middle" font-size="12" fill="#0b0b0b">and contract before reply</text>

  <line x1="20" y1="232" x2="980" y2="232" stroke="#e1e0d9" stroke-width="1"/>

  <!-- Lane 2: batch / distributed -->
  <text x="20" y="269" font-size="13" font-weight="700" fill="#0b0b0b">Batch / distributed</text>
  <text x="20" y="285" font-size="13" font-weight="700" fill="#0b0b0b">(e.g. Apache Spark)</text>

  <rect x="175" y="249" width="235" height="62" rx="6" fill="#fcfcfb" stroke="#2a78d6" stroke-width="1.5"/>
  <text x="292" y="271" text-anchor="middle" font-size="12" fill="#0b0b0b">Pre-flight: expected schema,</text>
  <text x="292" y="289" text-anchor="middle" font-size="12" fill="#0b0b0b">completeness, volume vs. baseline</text>

  <polygon points="415,274 415,286 428,280" fill="#898781"/>
  <rect x="435" y="249" width="200" height="62" rx="6" fill="#fcfcfb" stroke="#eb6834" stroke-width="1.5"/>
  <text x="535" y="271" text-anchor="middle" font-size="12" fill="#0b0b0b">Constraints as Spark</text>
  <text x="535" y="289" text-anchor="middle" font-size="12" fill="#0b0b0b">aggregation queries</text>

  <polygon points="640,274 640,286 653,280" fill="#898781"/>
  <rect x="660" y="249" width="235" height="62" rx="6" fill="#fcfcfb" stroke="#1baf7a" stroke-width="1.5"/>
  <text x="777" y="271" text-anchor="middle" font-size="12" fill="#0b0b0b">Reconciliation: row counts,</text>
  <text x="777" y="289" text-anchor="middle" font-size="12" fill="#0b0b0b">checksums, output bounds</text>

  <line x1="20" y1="329" x2="980" y2="329" stroke="#e1e0d9" stroke-width="1"/>

  <!-- Lane 3: streaming consumer -->
  <text x="20" y="366" font-size="13" font-weight="700" fill="#0b0b0b">Streaming</text>
  <text x="20" y="382" font-size="13" font-weight="700" fill="#0b0b0b">consumer</text>

  <rect x="175" y="346" width="235" height="62" rx="6" fill="#fcfcfb" stroke="#2a78d6" stroke-width="1.5"/>
  <text x="292" y="368" text-anchor="middle" font-size="12" fill="#0b0b0b">Validate against a schema</text>
  <text x="292" y="386" text-anchor="middle" font-size="12" fill="#0b0b0b">registry as messages arrive</text>

  <polygon points="415,371 415,383 428,377" fill="#898781"/>
  <rect x="435" y="346" width="200" height="62" rx="6" fill="#fcfcfb" stroke="#eb6834" stroke-width="1.5"/>
  <text x="535" y="368" text-anchor="middle" font-size="12" fill="#0b0b0b">Stateful checks</text>
  <text x="535" y="386" text-anchor="middle" font-size="12" fill="#0b0b0b">across the stream</text>

  <polygon points="640,371 640,383 653,377" fill="#898781"/>
  <rect x="660" y="346" width="235" height="62" rx="6" fill="#fcfcfb" stroke="#1baf7a" stroke-width="1.5"/>
  <text x="777" y="368" text-anchor="middle" font-size="12" fill="#0b0b0b">Downstream consumer's</text>
  <text x="777" y="386" text-anchor="middle" font-size="12" fill="#0b0b0b">own contract applies</text>

  <text x="500" y="440" text-anchor="middle" font-size="11" fill="#898781">Illustrative implementations of an architecture-agnostic principle &#8212; not an exhaustive list of where it applies</text>
</svg>
