<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="320" fill="#fcfcfb"/>

  <text x="450" y="40" text-anchor="middle" font-size="20" font-weight="700" fill="#0b0b0b">Data Quality Problems Compound Silently Through ML Pipelines</text>
  <text x="450" y="62" text-anchor="middle" font-size="13" fill="#52514e">Interviews with 53 AI practitioners across India, East/West Africa, and the U.S.</text>

  <line x1="450" y1="85" x2="450" y2="285" stroke="#e1e0d9" stroke-width="2"/>

  <!-- Left: any cascade -->
  <line x1="175" y1="115" x2="275" y2="115" stroke="#2a78d6" stroke-width="4" stroke-linecap="round"/>
  <text x="225" y="205" text-anchor="middle" font-size="84" font-weight="800" fill="#2a78d6">92%</text>
  <text x="225" y="238" text-anchor="middle" font-size="15" fill="#0b0b0b">of practitioners experienced</text>
  <text x="225" y="260" text-anchor="middle" font-size="15" fill="#0b0b0b">at least one &#8220;data cascade&#8221;</text>

  <!-- Right: multiple cascades -->
  <line x1="625" y1="115" x2="725" y2="115" stroke="#eb6834" stroke-width="4" stroke-linecap="round"/>
  <text x="675" y="205" text-anchor="middle" font-size="84" font-weight="800" fill="#eb6834">45%</text>
  <text x="675" y="238" text-anchor="middle" font-size="15" fill="#0b0b0b">experienced multiple</text>
  <text x="675" y="260" text-anchor="middle" font-size="15" fill="#0b0b0b">data cascades</text>

  <text x="450" y="308" text-anchor="middle" font-size="12" fill="#898781">Sambasivan et al., &#8220;Data Cascades in High-Stakes AI,&#8221; CHI 2021</text>
</svg>
