<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="480" fill="#fcfcfb"/>

  <text x="450" y="42" text-anchor="middle" font-size="21" font-weight="700" fill="#0b0b0b">Reported Outcomes: Data Observability Adoption vs. Business as Usual</text>
  <text x="450" y="64" text-anchor="middle" font-size="13" fill="#52514e">Two independent studies, same direction of travel</text>

  <line x1="460" y1="90" x2="460" y2="435" stroke="#e1e0d9" stroke-width="2"/>

  <!-- LEFT: ROI hero stat -->
  <text x="240" y="112" text-anchor="middle" font-size="13" font-weight="700" fill="#52514e">ADOPTING COMPARABLE PRACTICES</text>

  <line x1="185" y1="138" x2="295" y2="138" stroke="#2a78d6" stroke-width="4" stroke-linecap="round"/>
  <text x="240" y="248" text-anchor="middle" font-size="96" font-weight="800" fill="#2a78d6">358%</text>
  <text x="240" y="286" text-anchor="middle" font-size="19" font-weight="600" fill="#0b0b0b">return on investment</text>
  <text x="240" y="310" text-anchor="middle" font-size="16" fill="#0b0b0b">over three years</text>

  <text x="240" y="348" text-anchor="middle" font-size="13" fill="#52514e">driven by reclaimed data-personnel hours,</text>
  <text x="240" y="366" text-anchor="middle" font-size="13" fill="#52514e">avoided downtime losses, and steadier ML models</text>

  <text x="240" y="415" text-anchor="middle" font-size="12" fill="#898781">Forrester Consulting / Monte Carlo Data, 2025</text>

  <!-- RIGHT: worsening trend stats -->
  <text x="670" y="112" text-anchor="middle" font-size="13" font-weight="700" fill="#52514e">WITHOUT IT (2022 &#8594; 2023)</text>

  <!-- Row 1 -->
  <rect x="480" y="140" width="14" height="14" rx="2" fill="#eb6834"/>
  <text x="505" y="163" font-size="30" font-weight="800" fill="#0b0b0b">67 / month</text>
  <text x="505" y="184" font-size="13" fill="#52514e">average monthly data incidents</text>
  <rect x="710" y="140" width="130" height="26" rx="13" fill="none" stroke="#eb6834" stroke-width="1.5"/>
  <text x="775" y="157" text-anchor="middle" font-size="12" fill="#52514e">&#9650; from 59 in 2022</text>

  <!-- Row 2 -->
  <rect x="480" y="230" width="14" height="14" rx="2" fill="#eb6834"/>
  <text x="505" y="253" font-size="30" font-weight="800" fill="#0b0b0b">15 hrs</text>
  <text x="505" y="274" font-size="13" fill="#52514e">average time to resolve an incident</text>
  <rect x="710" y="230" width="130" height="26" rx="13" fill="none" stroke="#eb6834" stroke-width="1.5"/>
  <text x="775" y="247" text-anchor="middle" font-size="12" fill="#52514e">&#9650; 166% YoY</text>

  <!-- Row 3 -->
  <rect x="480" y="320" width="14" height="14" rx="2" fill="#eb6834"/>
  <text x="505" y="343" font-size="30" font-weight="800" fill="#0b0b0b">31%</text>
  <text x="505" y="364" font-size="13" fill="#52514e">of revenue impacted by data downtime</text>
  <rect x="710" y="320" width="130" height="26" rx="13" fill="none" stroke="#eb6834" stroke-width="1.5"/>
  <text x="775" y="337" text-anchor="middle" font-size="12" fill="#52514e">&#9650; from 26%</text>

  <text x="670" y="415" text-anchor="middle" font-size="12" fill="#898781">Monte Carlo / Wakefield Research, 2023</text>
</svg>
